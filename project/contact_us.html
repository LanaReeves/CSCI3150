<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Visual Focus Components</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <h3>Contact Us</h3>
      <a href="https://www.steamboatsprings.net/Directory.aspx"
        >View full directory</a
      >

      <div class="contact-row">
        <div class="contact-column">
          <h4 class="widgetTitle field p-name">Chuck Cerasoli</h4>
          <div class="title">Fire Chief</div>
          <a class="info" href="mailto:ccerasoli@steamboatsprings.net"
            >Email Chuck Cerasoli</a
          >
        </div>

        <div class="contact-column">
          <h4 class="widgetTitle field p-name">Joe Oakland</h4>
          <div class="title">Deputy Fire Chief</div>
          <a class="info" href="mailto:joakland@steamboatsprings.net"
            >Email Joe Oakland</a
          >
        </div>

        <div class="contact-column">
          <h4 class="widgetTitle field p-name">Shannon Yaconiello</h4>
          <div class="title">Fire Admin Assistant</div>
          <a class="info" href="mailto:syaconiello@steamboatsprings.net"
            >Email Shannon Yaconiello
          </a>
        </div>
      </div>

      <h4 class="widgetTitle field p-name">Fire Services</h4>

      <div class="field p-tel">
        <strong>Phone:</strong>
        <a class="info" href="tel:9708797170">970-879-7170</a>
      </div>
      <div class="field h-adr">
        <strong>Physical Address:</strong>
        <br />
        <span class="title">1015 Oak Street</span><br />
        <span class="title">Steamboat Springs</span>,
        <span class="title">CO</span>
        <span class="title">80487</span>
      </div>

      <br />
    </div>
  </body>
</html>
